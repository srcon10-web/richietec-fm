<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richietec FM Live</title>
</head>
<body>
  <h2>Richietec FM - Live</h2>
  <button id="playBtn">▶️ Play Live</button>
  <p id="status">Stopped</p>

  <script>
    // Your Render URL from the screenshot - already fixed
    const RENDER_STREAM_URL = "https://richietec-fm.onrender.com/stream";

    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('status');
    let audio = null;

    playBtn.addEventListener('click', () => {
      if (audio && !audio.paused) {
        audio.pause();
        audio = null;
        playBtn.textContent = "▶️ Play Live";
        statusText.textContent = "Stopped";
        return;
      }

      // Try /stream first, if that fails try common alternatives
      const url = RENDER_STREAM_URL + "?t=" + Date.now();
      
      audio = new Audio(url);
      audio.crossOrigin = "anonymous";
      audio.preload = "none";

      statusText.textContent = "Connecting... your free Render instance may take 50 seconds to wake up (as shown in your screenshot)";

      audio.play().then(() => {
        statusText.textContent = "🔴 LIVE - Richietec FM";
        playBtn.textContent = "⏸️ Stop";
      }).catch(err => {
        console.error(err);
        statusText.textContent = "Could not play /stream. Trying /radio.mp3...";
        // Auto-fallback to /radio.mp3 which is common for Icecast
        const fallback = new Audio("https://richietec-fm.onrender.com/radio.mp3?t=" + Date.now());
        fallback.crossOrigin = "anonymous";
        fallback.play().then(() => {
          audio = fallback;
          statusText.textContent = "🔴 LIVE - Richietec FM";
          playBtn.textContent = "⏸️ Stop";
        }).catch(() => {
          statusText.textContent = "Error. Open https://richietec-fm.onrender.com in a new tab to see if server is running.";
        });
      });
    });
  </script>
</body>
</html>
