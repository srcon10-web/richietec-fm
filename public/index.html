<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RICHIE TEC FM - Live</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;margin:0;padding:20px}
.card{max-width:500px;margin:30px auto;background:#1a1a1a;padding:25px;border-radius:15px;box-shadow:0 0 20px #000}
button{background:#e60000;color:#fff;border:none;padding:12px 25px;border-radius:8px;font-size:18px;cursor:pointer;margin:10px}
button.live{background:#00c853}
#status{margin:15px;font-weight:bold;font-size:18px}
input{padding:10px;width:80%;border-radius:6px;border:none;margin:10px}
audio{width:100%;margin-top:15px}
.hidden{display:none}
</style>
</head>
<body>
<h1>📻 RICHIE TEC FM</h1>
<p>Live from Freetown, Sierra Leone</p>

<div class="card" id="listenerCard">
<div id="status">Checking station...</div>
<button id="playBtn" onclick="startListening()">▶️ PLAY LIVE</button>
<audio id="audio" autoplay controls></audio>
<p><button onclick="showDJ()">DJ STUDIO</button></p>
</div>

<div class="card hidden" id="djCard">
<h3>DJ STUDIO ACCESS</h3>
<input id="pwd" type="password" placeholder="Enter DJ password">
<button onclick="loginDJ()">Unlock</button>
<div id="djPanel" class="hidden">
<div id="djStatus">OFFLINE</div>
<button id="goLiveBtn" onclick="toggleLive()">🔴 GO LIVE</button>
<button onclick="hideDJ()">Back to Listener</button>
<p id="listenerCount">0 listeners</p>
</div>
<button onclick="hideDJ()">Close</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({transports:['websocket','polling']});
const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
let isLive=false, stream, pcs={}, isBroadcaster=false;

const rtcConfig = { iceServers: [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}] };

socket.on('live-status', live => {
  isLive=live;
  statusEl.textContent = live? '🔴 LIVE NOW - Click PLAY' : '⚫ Station Offline - DJ not live';
  statusEl.style.color = live? '#00e676' : '#999';
});

function startListening(){
  socket.emit('watcher');
  statusEl.textContent='Connecting...';
}

socket.on('offer', async (broadcasterId, offer) => {
  const pc = new RTCPeerConnection(rtcConfig);
  pcs[broadcasterId]=pc;
  pc.ontrack = e => { audio.srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if(e.candidate) socket.emit('candidate', broadcasterId, e.candidate); };
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answer', broadcasterId, answer);
});

socket.on('candidate', (id, cand) => {
  const pc = pcs[id];
  if(pc) pc.addIceCandidate(new RTCIceCandidate(cand));
});

// DJ PART
function showDJ(){ document.getElementById('djCard').classList.remove('hidden'); document.getElementById('listenerCard').classList.add('hidden'); }
function hideDJ(){ document.getElementById('djCard').classList.add('hidden'); document.getElementById('listenerCard').classList.remove('hidden'); }
function loginDJ(){
  const pwd=document.getElementById('pwd').value;
  socket.emit('dj-auth', pwd, ok => {
    if(ok){ document.getElementById('djPanel').classList.remove('hidden'); }
    else alert('Wrong password');
  });
}
let live=false;
async function toggleLive(){
  if(!live){
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    live=true; isBroadcaster=true;
    document.getElementById('djStatus').textContent='🔴 ON AIR';
    document.getElementById('goLiveBtn').textContent='⏹️ STOP';
    socket.emit('broadcaster');
  } else {
    live=false; isBroadcaster=false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    document.getElementById('djStatus').textContent='OFFLINE';
    document.getElementById('goLiveBtn').textContent='🔴 GO LIVE';
    socket.emit('broadcaster-stop');
    Object.values(pcs).forEach(pc=>pc.close()); pcs={};
  }
}
socket.on('watcher', async (watcherId) => {
  if(!isBroadcaster ||!stream) return;
  const pc = new RTCPeerConnection(rtcConfig);
  pcs[watcherId]=pc;
  stream.getTracks().forEach(t=>pc.addTrack(t, stream));
  pc.onicecandidate = e => { if(e.candidate) socket.emit('candidate', watcherId, e.candidate); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer', watcherId, offer);
  document.getElementById('listenerCount').textContent = Object.keys(pcs).length+' listeners';
});
socket.on('answer', (id, ans) => { const pc=pcs[id]; if(pc) pc.setRemoteDescription(ans); });
</script>
</body>
</html>
