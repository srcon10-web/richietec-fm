<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Radio</title>
</head>
<body>
  <h2>Live Radio</h2>
  <button id="playBtn">▶️ Play Live</button>
  <p id="status">Stopped</p>

  <script>
    // ============================================
    // CHANGE ONLY THIS LINE TO YOUR RENDER URL
    // ============================================
    const RENDER_STREAM_URL = "https://YOUR-APP-NAME.onrender.com/stream";
    // Example: "https://my-radio-backend.onrender.com/stream"
    // Example for Icecast: "https://my-radio-backend.onrender.com/radio.mp3"
    // IMPORTANT: Must start with https:// and have NO port number like :8000
    // ============================================

    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('status');
    let audio = null;

    playBtn.addEventListener('click', () => {
      if (audio && !audio.paused) {
        audio.pause();
        audio = null;
        playBtn.textContent = "▶️ Play Live";
        statusText.textContent = "Stopped";
        return;
      }

      // Cache-buster to prevent browser from using old dead connection
      const streamWithBuster = RENDER_STREAM_URL + "?t=" + Date.now();

      audio = new Audio(streamWithBuster);
      audio.crossOrigin = "anonymous"; // Fixes CORS
      audio.preload = "none";

      statusText.textContent = "Connecting to Render... (may take 10s if server was sleeping)";

      audio.play().then(() => {
        statusText.textContent = "🔴 LIVE";
        playBtn.textContent = "⏸️ Stop";
      }).catch(err => {
        console.error(err);
        statusText.textContent = "Error: " + err.message + ". Check console.";
        alert("Could not play. Make sure your Render URL is correct and is https://");
      });

      audio.onerror = () => {
        statusText.textContent = "Stream error. Is your Render service running?";
      };
    });
  </script>
</body>
</html>
